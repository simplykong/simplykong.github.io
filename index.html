<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>simplykong — creative portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <a href="index.html" class="brand">
            simplykong
        </a>

        <div class="nav-links">

            <a href="#work">
                work
            </a>

            <a href="#about">
                about
            </a>

        </div>

    </nav>


    <!-- Hero -->

    <header class="hero">

        <div class="hero-glow"></div>

        <div class="hero-content">

            <p class="eyebrow">
                creative portfolio
            </p>

            <h1>
                simplykong
            </h1>

            <p class="hero-description">
                music · sound design · video · photography
            </p>

        </div>

    </header>


    <!-- Work -->

    <main id="work">

        <section class="portfolio-section">

            <div class="section-heading">

                <div>

                    <p class="eyebrow">
                        selected work
                    </p>

                    <h2>
                        projects
                    </h2>

                </div>

            </div>


            <!-- Filters -->

            <div class="filters">

                <button
                    class="filter-button active"
                    data-category="all">

                    all

                </button>


                <button
                    class="filter-button"
                    data-category="music">

                    music

                </button>


                <button
                    class="filter-button"
                    data-category="sound-design">

                    sound design

                </button>


                <button
                    class="filter-button"
                    data-category="video">

                    video

                </button>


                <button
                    class="filter-button"
                    data-category="photo">

                    photography

                </button>

            </div>


            <!-- Projects -->

            <div
                id="projects"
                class="projects-grid">

                <div class="loading">
                    loading...
                </div>

            </div>

        </section>


        <!-- About -->

        <section
            id="about"
            class="about-section">

            <div class="about-content">

                <p class="eyebrow">
                    about
                </p>

                <h2>
                    making things
                    <span>i think are cool.</span>
                </h2>

                <p class="about-text">
                    Music, sound design, video editing,
                    photography, and whatever else I feel
                    like creating.
                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <div class="footer-brand">
            simplykong
        </div>

        <p>
            © 2026 simplykong
        </p>

    </footer>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>

</html>
