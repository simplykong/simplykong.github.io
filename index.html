<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#06060a"
    >

    <meta
        name="description"
        content="kong — creative work"
    >

    <title>kong</title>

    <link
        rel="icon"
        type="image/png"
        href="https://cdn.discordapp.com/avatars/1429216999585615922/fa9f017aaaa3e55722eac94970084251.png?size=4096"
    >

    <link
        rel="preload"
        as="image"
        href="https://cdn.discordapp.com/avatars/1429216999585615922/fa9f017aaaa3e55722eac94970084251.png?size=4096"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <canvas
        class="background-layer"
        id="backgroundCanvas"
    ></canvas>

    <div
        class="glow-layer"
        id="glowLayer"
    ></div>

    <canvas
        class="particles-layer"
        id="particlesCanvas"
    ></canvas>

    <div
        class="vignette-layer"
    ></div>

    <div
        class="scanline-layer"
    ></div>


    <!-- =====================================================
         LANDING PAGE
         ===================================================== -->

    <main
        id="landing"
        class="landing-page"
    >

        <div class="logo-wrapper">

            <div
                class="logo-float"
                id="logoFloat"
            >

                <div
                    class="logo-interactive"
                    id="logoInteractive"
                >

                    <img
                        id="mainLogo"
                        src="https://cdn.discordapp.com/avatars/1429216999585615922/fa9f017aaaa3e55722eac94970084251.png?size=4096"
                        alt="kong"
                        draggable="false"
                    >

                    <span
                        class="logo-shine"
                        aria-hidden="true"
                    ></span>

                </div>

            </div>


            <button
                class="work-button"
                id="workButton"
                type="button"
            >

                <span>
                    Check out my work
                </span>

                <span class="arrow">
                    ↓
                </span>

            </button>

        </div>

    </main>


    <!-- =====================================================
         WORK AREA
         ===================================================== -->

    <section
        id="work"
        class="work-page"
        aria-hidden="true"
    >

        <div class="work-header">

            <button
                class="back-button"
                id="backButton"
                type="button"
            >

                <span>
                    ←
                </span>

                <span>
                    back
                </span>

            </button>


            <div class="work-brand">
                kong
            </div>

        </div>


        <!-- =================================================
             CATEGORY TABS
             ================================================= -->

        <nav
            class="category-tabs"
            aria-label="Portfolio categories"
        >

            <button
                class="category-tab active"
                data-category="video"
                type="button"
            >
                Video Editing
            </button>

            <button
                class="category-tab"
                data-category="sound-design"
                type="button"
            >
                Sound Design
            </button>

            <button
                class="category-tab"
                data-category="photography"
                type="button"
            >
                Photography
            </button>

            <button
                class="category-tab"
                data-category="graphic-design"
                type="button"
            >
                Graphic Design
            </button>

        </nav>


        <!-- =================================================
             CATEGORY TITLE
             ================================================= -->

        <div class="category-heading">

            <div
                class="category-number"
                id="categoryNumber"
            >
                01
            </div>

            <h1 id="categoryTitle">
                Video Editing
            </h1>

        </div>


        <!-- =================================================
             PROJECTS
             ================================================= -->

        <div
            id="projects"
            class="projects"
        >

            <div class="projects-loading">
                loading...
            </div>

        </div>


        <!-- =================================================
             WORK FOOTER
             ================================================= -->

        <footer class="work-footer">

            <span>
                kong
            </span>

            <span>
                creative work
            </span>

        </footer>

    </section>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="script.js"></script>

</body>

</html>
