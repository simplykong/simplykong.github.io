<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kong | Creative Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================= -->
    <!-- NAVIGATION -->
    <!-- ============================= -->

    <nav>

        <div class="logo">
            KONG
        </div>

        <div class="links">
            <a href="index.html">Home</a>
            <a href="music.html">Music</a>
            <a href="sound-design.html">Sound Design</a>
            <a href="video.html">Video</a>
            <a href="photography.html">Photography</a>
        </div>

    </nav>


    <!-- ============================= -->
    <!-- HERO -->
    <!-- ============================= -->

    <header class="hero">

        <div class="hero-content">

            <p class="eyebrow">
                CREATIVE PORTFOLIO
            </p>

            <h1>
                KONG
            </h1>

            <p class="hero-description">
                Sound Design • Music • Video • Visuals
            </p>

        </div>

    </header>


    <!-- ============================= -->
    <!-- PROJECTS -->
    <!-- ============================= -->

    <main>

        <section class="portfolio-section">

            <div class="section-header">

                <p class="eyebrow">
                    MY WORK
                </p>

                <h2>
                    Projects
                </h2>

            </div>


            <!-- CATEGORY FILTERS -->

            <div class="filters">

                <button
                    class="filter-button active"
                    data-category="all">
                    All
                </button>

                <button
                    class="filter-button"
                    data-category="music">
                    Music
                </button>

                <button
                    class="filter-button"
                    data-category="sound-design">
                    Sound Design
                </button>

                <button
                    class="filter-button"
                    data-category="video">
                    Video
                </button>

                <button
                    class="filter-button"
                    data-category="photo">
                    Photo
                </button>

            </div>


            <!-- PROJECTS -->

            <div
                id="projects"
                class="projects-grid">

                <div class="loading">
                    Loading projects...
                </div>

            </div>

        </section>

    </main>


    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->

    <footer>

        <p>
            © 2026 Kong
        </p>

    </footer>


    <!-- ============================= -->
    <!-- SUPABASE -->
    <!-- ============================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>

</html>
