<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>simplykong</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================================
         NAVIGATION
         ========================================= -->

    <nav class="navbar">

        <a
            href="#top"
            class="logo"
        >
            simplykong
        </a>

        <div class="nav-links">

            <a href="#work">
                work
            </a>

            <a href="#about">
                about
            </a>

        </div>

    </nav>


    <!-- =========================================
         HERO
         ========================================= -->

    <header
        id="top"
        class="hero"
    >

        <div class="hero-glow"></div>

        <div class="hero-content">

            <h1>
                simplykong
            </h1>

            <p class="hero-subtitle">
                stuff i've made.
            </p>

        </div>

    </header>


    <!-- =========================================
         WORK
         ========================================= -->

    <main>

        <section
            id="work"
            class="work-section"
        >

            <div class="section-title">

                <h2>
                    my work
                </h2>

                <div class="title-line"></div>

            </div>


            <!-- =====================================
                 FILTERS
                 ===================================== -->

            <div class="filters">

                <button
                    class="filter-button active"
                    data-category="all"
                >
                    all
                </button>

                <button
                    class="filter-button"
                    data-category="music"
                >
                    music
                </button>

                <button
                    class="filter-button"
                    data-category="sound-design"
                >
                    sound design
                </button>

                <button
                    class="filter-button"
                    data-category="video"
                >
                    video
                </button>

                <button
                    class="filter-button"
                    data-category="photo"
                >
                    photos
                </button>

            </div>


            <!-- =====================================
                 PROJECTS
                 ===================================== -->

            <div
                id="projects"
                class="projects-grid"
            >

                <div class="loading">
                    loading...
                </div>

            </div>

        </section>


        <!-- =========================================
             ABOUT
             ========================================= -->

        <section
            id="about"
            class="about-section"
        >

            <div class="about-inner">

                <h2>
                    hey, i'm simplykong.
                </h2>

                <p>
                    i make music, mess with sound,
                    edit videos, take photos, and
                    generally make whatever i feel
                    like making.
                </p>

            </div>

        </section>

    </main>


    <!-- =========================================
         FOOTER
         ========================================= -->

    <footer>

        <span>
            simplykong
        </span>

        <span>
            made with too much caffeine
        </span>

    </footer>


    <!-- =========================================
         SUPABASE
         ========================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="script.js"></script>

</body>

</html>
