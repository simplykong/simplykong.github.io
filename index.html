<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080604"
    >

    <meta
        name="description"
        content="kong — creative portfolio"
    >

    <title>kong</title>

    <link
        rel="icon"
        type="image/png"
        href="https://cdn.discordapp.com/avatars/1429216999585615922/fa9f017aaaa3e55722eac94970084251.png?size=4096"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- BACKGROUND -->

    <div class="background">

        <div class="background-glow"></div>

    </div>


    <!-- HOME -->

    <main
        id="home"
        class="home"
    >

        <div class="home-content">

            <img
                class="logo"
                src="https://cdn.discordapp.com/avatars/1429216999585615922/fa9f017aaaa3e55722eac94970084251.png?size=4096"
                alt="kong"
                draggable="false"
            >

            <button
                id="workButton"
                class="work-button"
                type="button"
            >

                <span>
                    Check out my work
                </span>

                <span class="work-arrow">
                    ↓
                </span>

            </button>

        </div>

    </main>


    <!-- WORK -->

    <main
        id="work"
        class="work"
    >

        <!-- TOP -->

        <header class="work-top">

            <button
                id="backButton"
                class="back-button"
                type="button"
            >

                <span class="back-arrow">
                    ←
                </span>

                <span>
                    back
                </span>

            </button>


            <div class="work-logo">
                kong
            </div>

        </header>


        <!-- CATEGORY TABS -->

        <nav
            class="tabs"
            aria-label="Portfolio categories"
        >

            <button
                class="tab active"
                data-category="video"
                type="button"
            >

                <span class="tab-number">
                    01
                </span>

                <span class="tab-name">
                    Video Editing
                </span>

            </button>


            <button
                class="tab"
                data-category="sound-design"
                type="button"
            >

                <span class="tab-number">
                    02
                </span>

                <span class="tab-name">
                    Sound Design
                </span>

            </button>


            <button
                class="tab"
                data-category="photography"
                type="button"
            >

                <span class="tab-number">
                    03
                </span>

                <span class="tab-name">
                    Photography
                </span>

            </button>


            <button
                class="tab"
                data-category="graphic-design"
                type="button"
            >

                <span class="tab-number">
                    04
                </span>

                <span class="tab-name">
                    Graphic Design
                </span>

            </button>

        </nav>


        <!-- PROJECTS -->

        <section class="projects-section">

            <div
                id="projects"
                class="projects"
            >

                <div class="loading">
                    loading...
                </div>

            </div>


            <!-- PAGINATION -->

            <div
                id="pagination"
                class="pagination"
            >

                <button
                    id="previousPage"
                    class="page-button"
                    type="button"
                    aria-label="Previous projects"
                >
                    ←
                </button>


                <div
                    id="pageIndicator"
                    class="page-indicator"
                >
                    01 / 01
                </div>


                <button
                    id="nextPage"
                    class="page-button"
                    type="button"
                    aria-label="Next projects"
                >
                    →
                </button>

            </div>

        </section>


        <!-- FOOTER -->

        <footer class="footer">

            <span>
                kong
            </span>

            <span>
                creative work
            </span>

        </footer>

    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script
        src="script.js"
    ></script>

</body>

</html>
