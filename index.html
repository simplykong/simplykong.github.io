<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>simplykong</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         TOP
         ========================================= -->

    <header class="top">

        <a
            href="#"
            class="logo"
        >
            simplykong
        </a>


        <nav>

            <a href="#work">
                work
            </a>

            <a href="#about">
                about
            </a>

        </nav>

    </header>



    <!-- =========================================
         HERO
         ========================================= -->

    <section class="hero">

        <div class="hero-background"></div>


        <div class="hero-content">

            <h1>
                simplykong
            </h1>

            <div class="hero-bottom">

                <span>
                    music · sound · video · photo
                </span>

                <span>
                    ↓ scroll
                </span>

            </div>

        </div>

    </section>



    <!-- =========================================
         WORK
         ========================================= -->

    <main id="work">


        <section class="work">


            <div class="work-top">

                <h2>
                    stuff i've made
                </h2>


                <div class="filters">

                    <button
                        class="filter-button active"
                        data-category="all"
                    >
                        all
                    </button>

                    <button
                        class="filter-button"
                        data-category="music"
                    >
                        music
                    </button>

                    <button
                        class="filter-button"
                        data-category="sound-design"
                    >
                        sound
                    </button>

                    <button
                        class="filter-button"
                        data-category="video"
                    >
                        video
                    </button>

                    <button
                        class="filter-button"
                        data-category="photo"
                    >
                        photo
                    </button>

                </div>

            </div>



            <!-- PROJECTS -->

            <div
                id="projects"
                class="gallery"
            >

                <div class="loading">
                    loading...
                </div>

            </div>


        </section>



        <!-- =========================================
             ABOUT
             ========================================= -->

        <section
            id="about"
            class="about"
        >

            <div class="about-left">

                <span>
                    about
                </span>

            </div>


            <div class="about-right">

                <h2>
                    just making
                    cool stuff.
                </h2>


                <p>
                    music, sound design,
                    video editing, photography,
                    and whatever else ends up
                    being fun to make.
                </p>

            </div>

        </section>


    </main>



    <!-- =========================================
         FOOTER
         ========================================= -->

    <footer>

        <div>
            simplykong
        </div>

        <div>
            © 2026
        </div>

    </footer>



    <!-- =========================================
         SUPABASE
         ========================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="script.js"></script>


</body>

</html>
