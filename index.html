<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#070503"
    >

    <meta
        name="description"
        content="kong — creative work"
    >

    <title>kong</title>

    <link
        rel="icon"
        type="image/png"
        href="https://cdn.discordapp.com/avatars/1429216999585615922/fa9f017aaaa3e55722eac94970084251.png?size=4096"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- BACKGROUND -->

    <canvas
        class="background-layer"
        id="backgroundCanvas"
    ></canvas>

    <div
        class="glow-layer"
    ></div>

    <canvas
        class="particles-layer"
        id="particlesCanvas"
    ></canvas>

    <div
        class="vignette-layer"
    ></div>

    <div
        class="scanline-layer"
    ></div>


    <!-- =====================================================
         LANDING PAGE
         ===================================================== -->

    <main
        id="landing"
        class="landing-page"
    >

        <div class="landing-content">

            <div class="logo-float">

                <div class="logo-interactive">

                    <img
                        id="mainLogo"
                        src="https://cdn.discordapp.com/avatars/1429216999585615922/fa9f017aaaa3e55722eac94970084251.png?size=4096"
                        alt="kong"
                        draggable="false"
                    >

                </div>

            </div>


            <button
                class="work-button"
                id="workButton"
                type="button"
            >

                <span>
                    Check out my work
                </span>

                <span class="arrow">
                    ↓
                </span>

            </button>

        </div>

    </main>


    <!-- =====================================================
         WORK PAGE
         ===================================================== -->

    <section
        id="work"
        class="work-page"
        aria-hidden="true"
    >

        <!-- HEADER -->

        <header class="work-header">

            <button
                class="back-button"
                id="backButton"
                type="button"
            >

                <span class="back-arrow">
                    ←
                </span>

                <span>
                    back
                </span>

            </button>


            <div class="work-brand">
                kong
            </div>

        </header>


        <!-- INTRO -->

        <section class="work-intro">

            <div class="intro-small">
                SELECTED WORK
            </div>

            <h1>
                stuff i've made.
            </h1>

            <p>
                Video, sound, photography, graphics,
                and whatever else I feel like making.
            </p>

        </section>


        <!-- CATEGORY NAVIGATION -->

        <nav
            class="category-tabs"
            aria-label="Portfolio categories"
        >

            <button
                class="category-tab active"
                data-category="video"
                type="button"
            >

                <span class="tab-number">
                    01
                </span>

                Video Editing

            </button>


            <button
                class="category-tab"
                data-category="sound-design"
                type="button"
            >

                <span class="tab-number">
                    02
                </span>

                Sound Design

            </button>


            <button
                class="category-tab"
                data-category="photography"
                type="button"
            >

                <span class="tab-number">
                    03
                </span>

                Photography

            </button>


            <button
                class="category-tab"
                data-category="graphic-design"
                type="button"
            >

                <span class="tab-number">
                    04
                </span>

                Graphic Design

            </button>

        </nav>


        <!-- CATEGORY HEADER -->

        <div class="category-heading">

            <div
                class="category-number"
                id="categoryNumber"
            >
                01
            </div>

            <div>

                <div
                    class="category-label"
                    id="categoryLabel"
                >
                    VIDEO EDITING
                </div>

                <h2
                    id="categoryTitle"
                >
                    Video Editing
                </h2>

            </div>

        </div>


        <!-- PROJECTS -->

        <div
            id="projects"
            class="projects"
        >

            <div class="projects-loading">
                loading...
            </div>

        </div>


        <!-- FOOTER -->

        <footer class="work-footer">

            <div>
                kong
            </div>

            <div>
                creative work
            </div>

        </footer>

    </section>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="script.js"
    ></script>

</body>

</html>
