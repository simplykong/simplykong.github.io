<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
        <meta name="theme-color" content="#06060a">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="description" content="Soonix">
        <title>Soonix</title>
        <link rel="icon" type="image/png" href="Soonix.png">
        <link rel="preload" as="image" href="Soonix.png">
        <style>
            :root {
                --bg: #06060a;
                --brand-a: #634aec;
                --brand-b: #564aff;
                --brand-a-rgb: 99,74,236;
                --brand-b-rgb: 86,74,255;
                --brand-mid-rgb: 92,74,246
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box
            }

            body,html {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
                cursor: default
            }

            .l {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%
            }

            #a {
                z-index: 1
            }

            #b {
                z-index: 2;
                pointer-events: none;
                filter: blur(64px) saturate(135%);
                opacity: .85;
                background: radial-gradient(closest-side at 38% 42%,rgba(var(--brand-a-rgb),.5),transparent 70%),radial-gradient(closest-side at 64% 58%,rgba(var(--brand-b-rgb),.45),transparent 70%),radial-gradient(closest-side at 52% 50%,rgba(var(--brand-mid-rgb),.3),transparent 72%);
                background-repeat: no-repeat;
                background-size: 65% 65%,70% 70%,82% 82%;
                mix-blend-mode: screen;
                animation: 28s ease-in-out infinite b-drift
            }

            #c {
                z-index: 3;
                pointer-events: none
            }

            #d {
                z-index: 4;
                pointer-events: none;
                background: radial-gradient(ellipse 140% 140% at 50% 50%,rgba(6,6,10,0) 0,rgba(6,6,10,0) 40%,rgba(6,6,10,.02) 52%,rgba(6,6,10,.05) 62%,rgba(6,6,10,.09) 70%,rgba(6,6,10,.15) 78%,rgba(6,6,10,.22) 85%,rgba(6,6,10,.31) 92%,rgba(6,6,10,.42) 100%)
            }

            #e {
                z-index: 5;
                pointer-events: none;
                opacity: .3;
                background-image: repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(var(--brand-mid-rgb),.05) 3px,rgba(0,0,0,.07) 4px);
                background-size: 100% 4px;
                animation: 16s linear infinite scan-scroll
            }

            @keyframes b-drift {
                0%,100% {
                    background-position: 28% 38%,70% 60%,50% 50%;
                    transform: scale(1)
                }

                33% {
                    background-position: 42% 30%,56% 70%,60% 44%;
                    transform: scale(1.06)
                }

                66% {
                    background-position: 34% 50%,64% 48%,44% 58%;
                    transform: scale(1.03)
                }
            }

            #e::after {
                content: "";
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                height: 42%;
                background: linear-gradient(to bottom,transparent 0,rgba(var(--brand-mid-rgb),.045) 50%,transparent 100%);
                mix-blend-mode: screen;
                animation: 11s linear infinite crt-band
            }

            @keyframes scan-scroll {
                from {
                    background-position: 0 0
                }

                to {
                    background-position: 0 200px
                }
            }

            @keyframes crt-band {
                from {
                    transform: translateY(-100%)
                }

                to {
                    transform: translateY(340%)
                }
            }

            #f {
                position: fixed;
                inset: 0;
                z-index: 10;
                display: grid;
                place-items: center;
                padding: 24px;
                pointer-events: none;
                perspective: 1100px
            }

            #g {
                pointer-events: auto;
                cursor: pointer;
                opacity: 0;
                transform: scale(.86);
                transition: opacity 1.1s,transform 1.1s cubic-bezier(.22, 1, .36, 1)
            }

            #g.in {
                opacity: 1;
                transform: scale(1)
            }

            #h {
                animation: 6.5s ease-in-out infinite j-bob,9s ease-in-out infinite j-drift;
                will-change: transform
            }

            #i {
                position: relative;
                transition: transform .55s cubic-bezier(.22, 1, .36, 1);
                will-change: transform
            }

            #j {
                display: block;
                width: min(55vw,55vh);
                max-width: 700px;
                height: auto;
                user-select: none;
                -webkit-user-drag: none;
                filter: drop-shadow(0 0 26px rgba(var(--brand-mid-rgb), .3));
                animation: 4.5s ease-in-out infinite j-glow
            }

            #k {
                position: absolute;
                inset: 0;
                pointer-events: none;
                overflow: hidden;
                opacity: 0;
                -webkit-mask: url("Soonix.png") center/contain no-repeat;
                mask: url("Soonix.png") center/contain no-repeat
            }

            #k::before {
                content: "";
                position: absolute;
                top: -20%;
                left: -65%;
                width: 45%;
                height: 140%;
                transform: skewX(-18deg);
                background: linear-gradient(105deg,transparent 0,rgba(255,255,255,.1) 40%,rgba(210,203,255,.85) 50%,rgba(255,255,255,.1) 60%,transparent 100%)
            }

            #g:hover #i {
                transform: scale(1.07)
            }

            #g:hover #j {
                animation: none;
                filter: drop-shadow(0 0 44px rgba(var(--brand-a-rgb), .6))
            }

            #g:hover #k {
                animation: .95s ease-out k-fade
            }

            #g:hover #k::before {
                animation: .95s ease-out k-move
            }

            @keyframes j-bob {
                0%,100% {
                    transform: translateY(0)
                }

                50% {
                    transform: translateY(-1.6vmin)
                }
            }

            @keyframes j-drift {
                0%,100% {
                    transform: translateX(0)
                }

                50% {
                    transform: translateX(1.1vmin)
                }
            }

            @keyframes j-glow {
                0%,100% {
                    filter: drop-shadow(0 0 22px rgba(var(--brand-mid-rgb), .24))
                }

                50% {
                    filter: drop-shadow(0 0 40px rgba(var(--brand-a-rgb), .48))
                }
            }

            @keyframes k-fade {
                0%,100% {
                    opacity: 0
                }

                12% {
                    opacity: 1
                }
            }

            @keyframes k-move {
                0% {
                    left: -65%
                }

                100% {
                    left: 135%
                }
            }

            @media (max-width: 768px) {
                #j {
                    width:min(82vw,82vh)
                }
            }

            @media (prefers-reduced-motion:reduce) {
                #b,#e,#e::after,#h,#j {
                    animation: none
                }

                #g {
                    opacity: 1;
                    transform: none;
                    transition: none
                }
            }
        </style>
    </head>

                    </div>
                </div>
            </div>
        </main>
